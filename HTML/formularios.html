<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>

<body>
    <form method="GET" action="/cadastro">

        <input type="text" name="v"><br>

        <input type="checkbox" name="checkbox1" value="opcao1"> Opção 1<br>
        <input type="checkbox" name="checkbox2" value="opcao2"> Opção 2<br>

        <input type="radio" name="genero" value="m"> Masc<br>
        <input type="radio" name="genero" value="f"> Fem<br>
        <!-- para selecionar apenas uma opção on nomes devem ser iguais -->

        <input type="reset" value="Limpar">
        <input type="submit"> <br><br><br><br>

        <select name="estado">

            <option value="sp">São Paulo</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="mg">Minas Gerais</option>
        </select>
    </form>
<br>
    <form method="GET" action="/cadastro">

        <input type="text" name="assunto"><br>
        <input type="color" name="cor"><br>
        <textarea name="mensagem" rows="5" cols="30"></textarea><br>
        <input type="submit" value="Enviar">

    </form>

    

</body>

</html>
